name: Artifact consistency
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_artifacts.py
      - name: Check experimental host components without data or network
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: experiments/geopilot_rsih_learning
        run: python -B -m unittest test_outer_agent_dispatch test_outer_agent_receipt test_outer_config.RegisteredSetTest
